name: Tests

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python }}, Pillow ${{ matrix.pillow }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Frappe v15 pins Pillow 10, which cannot read AVIF.
          - python: "3.11"
            pillow: "~=10.4"
          # A current Pillow, which decodes AVIF.
          - python: "3.12"
            pillow: "~=12.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The unit tests import only Pillow, not Frappe, so no bench is needed.
      - name: Install dependencies
        run: python -m pip install "pillow${{ matrix.pillow }}"

      - name: Run tests
        run: python -m unittest discover -v -s frappe_s3_attachment/tests -t .
